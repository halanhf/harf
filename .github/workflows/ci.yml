name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run by hand on any branch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the runner's preinstalled node has the built-in test runner, so no setup step or dependencies
      - run: node --version && node --test tests/logic.test.js
      # docs/ is the installable app built from index.html; it must match the source
      - name: installed app is up to date
        run: |
          python3 build.py
          git diff --exit-code -- docs || { echo "docs/ is stale: run python build.py and commit"; exit 1; }
          test -z "$(git status --porcelain -- docs)" || { echo "docs/ has untracked files: run python build.py and commit"; exit 1; }
      # the readme's local install command: the server answers on 127.0.0.1 with the page, worker and manifest
      - name: local server from the readme serves the app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 -d docs & sleep 2
          curl -sf -o /tmp/page.html http://127.0.0.1:8000/ && grep -q 'rel="manifest"' /tmp/page.html
          curl -sf -o /tmp/sw.js http://127.0.0.1:8000/sw.js && grep -q 'harf-v' /tmp/sw.js
          curl -sf -o /tmp/m.json http://127.0.0.1:8000/manifest.webmanifest
          python3 -c "import json; m=json.load(open('/tmp/m.json')); assert m['display']=='standalone' and len(m['icons'])>=3"
  # the owner builds and serves on windows: a crlf checkout must still build the same docs/, and the readme commands must work in powershell
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: build matches on a windows checkout
        shell: pwsh
        run: |
          python build.py
          git diff --exit-code -- docs
          if ($LASTEXITCODE -ne 0) { throw "docs/ differs when built on windows" }
      - name: tests
        shell: pwsh
        run: node --test tests/logic.test.js
      - name: local server from the readme
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList '-m','http.server','8000','--bind','127.0.0.1','-d','docs' -PassThru
          Start-Sleep -Seconds 3
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/
          if ($r.Content -notmatch 'rel="manifest"') { throw "page not served" }
          Stop-Process -Id $p.Id
