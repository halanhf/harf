name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the runner's preinstalled node has the built-in test runner, so no setup step or dependencies
      - run: node --version && node --test tests/logic.test.js
