name: pages
# publishes docs/ (the installable app) to GitHub Pages. needs Settings > Pages > Source: GitHub Actions,
# and Pages needs a public repo (or GitHub Pro for a private one). manual until that's set up, so it can't fail on every push.
# once it works, add back:  push: {branches: [main], paths: ["docs/**"]}
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
