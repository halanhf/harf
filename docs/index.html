{"id":"s1u042","stage":1,"title":"I brought you something","goal":"Arrive at Sēf's family home, greet Umm Sēf, say how you came and what you brought, and ask after Sēf.","grammar":"Past tense II: come and bring (yīt, yibt, ma yā)","tip":"'Come' and 'bring' are irregular: yīt (I came, you came), yā (he came), ma yā (he didn't come, he hasn't come); yibt (I brought, you brought), yāb (he brought). Emiratis say y where fuṣḥā and many other speakers have j (jīt, jibt), so these are written with ي.","dialogue":[["A","حياك الله يا سالم، تفضل","ḥayyāk allāh yā Sālim, tfaẓẓal","Welcome, Salim. Come in."],["B","الله يحييج. يبت لكم حلويات","allāh yḥayyīch. yibt-lkum ḥalawiyyāt","Thank you. I brought you all some sweets."],["A","ما قصرت، بس ما في داعي!","mā gaṣṣart, bas ma fī dāʿi!","That's very kind, but there was no need!"],["B","ما سوينا شي. سيف هني، الله يخليج؟","mā sawwēna shay. Sēf hni, allāh ykhallīch?","It's nothing. Is Sēf in, please?"],["A","ما يا من الجامعة. ييت ويا منو؟","ma yā min il-jāmʿa. yīt wiyya minu?","He hasn't come back from the university yet. Who did you come with?"],["B","ييت بروحي، بتاكسي","yīt b-rūḥi, b-tāksi","I came on my own, by taxi."]],"items":[["ييت","yīt","I came; you came (to a man)","جئتُ / جئتَ","to a woman: yīti (ييتي); Kuwait: jīt (جيت)"],["يبت","yibt","I brought; you brought (to a man)","أحضرتُ / أحضرتَ","to a woman: yibti (يبتي); Kuwait: jibt (جبت)"],["يبت لك","yibt-lak","I brought you (to a man)","أحضرت لك","to a woman: yibt-lich (يبت لج); to a group or a family: yibt-lkum (يبت لكم)"],["ما يا","ma yā","he didn't come; he hasn't come","لم يأتِ","he came: yā"],["حلويات","ḥalawiyyāt","sweets","حلويات",""],["ما في داعي","ma fī dāʿi","there's no need","لا داعي","you'll see written مافي داعي; also very common: ma lah dāʿi (ما له داعي, you'll see written ماله داعي)"],["ما سوينا شي","mā sawwēna shay","it was nothing (reply to mā gaṣṣart)","لم نفعل شيئًا",""],["بروحي","b-rūḥi","on my own, by myself","وحدي",""],["بتاكسي","b-tāksi","by taxi","بسيارة أجرة","also said: fi t-tāksi (في التاكسي)"]]},
{"id":"s1u043","stage":1,"title":"Checkpoint 1.2: Sēf's weekend","goal":"Follow Sēf's story of a weekend in the desert and ask about it, using the past for other people.","grammar":"checkpoint 1.2","tip":"Review: the past endings you know, now for other people. We: sawwēna, shifna. You all: sawwētu, nimtu. He: yāb (brought), gāl (said). She: gālat. The -ē- of sawwēt stays: sawwēna, sawwētu.","dialogue":[["B","هلا سيف! شو سويت في الويكند؟","hala Sēf! shu sawwēt fi l-wīkind?","Hi Sēf! What did you do at the weekend?"],["A","رحنا البر. أبوي ياب الخيمة","riḥna l-barr. ubūy yāb il-khēma","We went out to the desert. My dad brought the tent."],["B","حلو! وشو سويتوا هناك؟","ḥilu! w shu sawwētu hnāk?","Nice! And what did you do there?"],["A","سوينا شاي، وشفنا النجوم","sawwēna chāy, w shifna n-nujūm","We made tea, and we looked at the stars."],["B","ما شاء الله! ونمتوا هناك؟","mā shāʼ allāh! w nimtu hnāk?","Wonderful! And did you sleep out there?"],["A","لا، أمي قالت: لازم نرجع!","la, ummi gālat: lāzim nirjaʿ!","No, my mum said: we have to go back!"]],"items":[["سوينا","sawwēna","we did, we made","فعلنا",""],["سويتوا","sawwētu","you did (to a group)","فعلتم","to one man: sawwēt; to one woman: sawwēti"],["شفنا","shifna","we saw","رأينا",""],["نمتوا","nimtu","you slept (to a group)","نمتم","to one man: nimt; to one woman: nimti"],["ياب","yāb","he brought","أحضر","she brought: yābat (يابت)"],["قالت","gālat","she said","قالت","he said: gāl (قال)"]]},
{"id":"s1u044","stage":1,"title":"Which day?","goal":"On a late-night call, pick a day to go out with a friend, name the days of the week, and say good night.","grammar":"Days of the week: yōm + day","tip":"Days come with yōm 'day': yōm il-aḥad (Sun), il-ithnēn (Mon), ith-thalātha (Tue), il-arbaʿa (Wed), il-khamīs (Thu), il-jumʿa (Fri), is-sabt (Sat). yōm can be dropped, and no word for 'on' is needed: (yōm) il-jumʿa ʿindi shughul (on Friday I've got work).","culture":"Since January 2022 the UAE's official weekend has been Saturday and Sunday, and federal government offices close at Friday noon (Sharjah's government takes Friday off too). Kuwait's weekend is Friday and Saturday. Friday's noon prayer is the main prayer of the week, so Friday plans usually start after it.","dialogue":[["A","نروح البحر هالأسبوع؟","nrūḥ il-baḥar hal-usbūʿ?","Shall we go to the beach this week?"],["B","يلا! أي يوم؟","yalla! ay yōm?","Sure! Which day?"],["A","يوم الجمعة؟","yōm il-jumʿa?","Friday?"],["B","الجمعة عندي شغل. يوم ثاني؟","il-jumʿa ʿindi shughul. yōm thāni?","Friday I've got work. Another day?"],["A","زين، يوم السبت. تصبح على خير!","zēn, yōm is-sabt. tiṣbaḥ ʿala khēr!","OK, Saturday then. Good night!"],["B","وانت من أهله","w inta min ahlah","Good night to you too."]],"items":[["نروح…؟","nrūḥ…?","shall we go…?","هل نذهب…؟","nrūḥ il-baḥar? = shall we go to the beach?"],["يوم الجمعة","yōm il-jumʿa","Friday, on Friday","يوم الجمعة","relaxed speech: yōm il-yimʿa"],["يوم السبت","yōm is-sabt","Saturday, on Saturday","يوم السبت",""],["أي يوم؟","ay yōm?","which day?","أي يوم؟",""],["هالأسبوع","hal-usbūʿ","this week","هذا الأسبوع",""],["يوم ثاني","yōm thāni","another day","يومًا آخر",""],["عندي شغل","ʿindi shughul","I've got work, I'm busy","عندي عمل",""],["تصبح على خير","tiṣbaḥ ʿala khēr","good night (to a man)","تصبح على خير","to a woman: tiṣbaḥīn ʿala khēr (تصبحين على خير); reply: w inta min ahlah"],["وانت من أهله","w inta min ahlah","reply to good night (to a man)","وأنت من أهله","to a woman: w inti min ahlah"]]},
{"id":"s1u045","stage":1,"title":"Mornings and afternoons","goal":"Compare your day with a colleague's: morning, midday, afternoon, evening and night.","grammar":"Parts of the day: iṣ-ṣubḥ, iẓ-ẓuhur, il-ʿaṣr, il-lēl","tip":"Most parts of the day need no word for 'in': iṣ-ṣubḥ ashtaghil (in the morning I work), il-ʿaṣr fi l-jāmʿa (in the afternoon at the university). Night usually takes one: fi l-lēl (at night). Plans are often timed by prayers: baʿd il-maghrib.","culture":"The five prayers frame the day: il-fajr (dawn), iẓ-ẓuhur (midday), il-ʿaṣr (afternoon), il-maghrib (sunset), il-ʿisha (night). People often set times by them ('after ʿaṣr', 'before maghrib'), and the clock times move with the seasons: in Dubai, maghrib is about 5:30 pm in winter and about 7 pm in summer.","dialogue":[["B","مريم، تشتغلين الصبح بس؟","Maryam, tishtaghlīn iṣ-ṣubḥ bas?","Maryam, do you only work mornings?"],["A","لا، الصبح والعصر. وانت؟","la, iṣ-ṣubḥ w il-ʿaṣr. w inta?","No, mornings and afternoons. And you?"],["B","أنا هني الصبح، والعصر في الجامعة","ana hni ṣ-ṣubḥ, w il-ʿaṣr fi l-jāmʿa","I'm here in the mornings, and at the university in the afternoons."],["A","ما شاء الله! ومتى ترتاح؟","mā shāʼ allāh! w mita tirtāḥ?","Wow! And when do you rest?"],["B","في الليل، بعد المغرب","fi l-lēl, baʿd il-maghrib","At night, after maghrib."],["A","زين. يلا، نتغدى ويا الكل الظهر؟","zēn. yalla, nitghadda wiyya l-kill iẓ-ẓuhur?","Good. Shall we have lunch with everyone at midday?"]],"items":[["الصبح","iṣ-ṣubḥ","the morning; in the morning","الصباح / صباحًا",""],["الظهر","iẓ-ẓuhur","midday; at midday","الظهر / ظهرًا","also the midday prayer"],["العصر","il-ʿaṣr","the late afternoon; in the afternoon","العصر / عصرًا","also the afternoon prayer"],["الليل","il-lēl","the night","الليل","at night: fi l-lēl; also said: bil-lēl (بالليل)"],["بعد المغرب","baʿd il-maghrib","after maghrib (sunset prayer), early evening","بعد المغرب","UAE also: ʿugub il-maghrib (عقب المغرب)"],["تشتغلين","tishtaghlīn","you work (to a woman)","تعملين","to a man: tishtaghil (تشتغل)"],["ترتاح","tirtāḥ","you rest (to a man)","ترتاح","to a woman: tirtāḥīn (ترتاحين)"],["نتغدى","nitghadda","we have lunch; shall we have lunch?","نتغدى",""]]},
{"id":"s1u046","stage":1,"title":"What time is the film?","goal":"Tell the time with half past, quarter past and quarter to, and count minutes, before a film with Sēf.","grammar":"Telling the time (w nuṣṣ, w rubʿ, illa rubʿ); a singular noun after 11","tip":"is-sāʿa + hour: is-sāʿa thintēn (two o'clock), is-sāʿa waḥda (one). Then w nuṣṣ (half past), w rubʿ (quarter past), illa rubʿ (quarter to). From 11 up the noun stays singular: ʿishrīn dagīga, khamsīn dirham, but khams dagāyig.","dialogue":[["A","الساعة كم الحين؟","is-sāʿa cham il-ḥīn?","What time is it now?"],["B","الساعة ثنتين ونص","is-sāʿa thintēn w nuṣṣ","It's half past two."],["A","والفلم الساعة ثلاث إلا ربع!","w il-film is-sāʿa thalāth illa rubʿ!","And the film's at quarter to three!"],["B","يعني بعد ربع ساعة؟ والتذكرة بكم؟","yaʿni baʿd rubʿ sāʿa? w it-tadhkara b-cham?","So in a quarter of an hour? And how much is the ticket?"],["A","بخمسين درهم. والسينما عشرين دقيقة من هني!","b-khamsīn dirham. w is-sīnama ʿishrīn dagīga min hni!","Fifty dirhams. And the cinema's twenty minutes from here!"],["B","يلا بسرعة! كل مرة نتأخر","yalla b-surʿa! kill marra nitʼakhkhar","Come on, quick! We're late every time."]],"items":[["نص","nuṣṣ","half; half past (thintēn w nuṣṣ)","نصف","half an hour: nuṣṣ sāʿa"],["وربع","w rubʿ","quarter past (thintēn w rubʿ)","والربع","a quarter: rubʿ (ربع), as in rubʿ sāʿa; quarter to: illa rubʿ"],["إلا ربع","illa rubʿ","quarter to (thalāth illa rubʿ)","إلا ربعًا",""],["ربع ساعة","rubʿ sāʿa","a quarter of an hour","ربع ساعة",""],["دقيقة","dagīga","a minute","دقيقة","3 to 10 take the plural (khams dagāyig); 11 and up the singular (ʿishrīn dagīga)"],["كل مرة","kill marra","every time","كل مرة",""],["الفلم","il-film","the film","الفيلم","you'll see written الفيلم"],["السينما","is-sīnama","the cinema","السينما",""],["نتأخر","nitʼakhkhar","we're late (as a habit), we get late","نتأخر","I: atʼakhkhar (أتأخر); late right now: taʼakhkharna 'we're late', taʼakhkhart 'I'm late'"]]},
{"id":"s1u047","stage":1,"title":"What time do you finish?","goal":"Agree a time with Maryam, your colleague, to meet about work.","tip":"To fix a time, say the day, then is-sāʿa and the hour. No word for 'at' is needed: bāchir is-sāʿa tisʿ w rubʿ (tomorrow at 9:15), baʿd bāchir iṣ-ṣubḥ (the day after tomorrow, in the morning).","grammar":"Telling the time with a day: bāchir is-sāʿa tisʿ","dialogue":[["A","سالم، متى بتخلص اليوم؟","Sālim, mita bitkhalliṣ il-yōm?","Salim, what time do you finish today?"],["B","خمس ونص. وانتي متى بتخلصين؟","khams w nuṣṣ. w inti mita bitkhallṣīn?","Half past five. And when do you finish?"],["A","أنا أخلص بدري. نتلاقى باكر الساعة تسع؟","ana akhalliṣ badri. nitlāga bāchir is-sāʿa tisʿ?","I finish early. Shall we meet tomorrow at nine?"],["B","باكر عندي موعد. بعد باكر؟","bāchir ʿindi mawʿid. baʿd bāchir?","Tomorrow I've got an appointment. The day after?"],["A","زين. بعد باكر الساعة تسع وربع يناسبك؟","zēn. baʿd bāchir is-sāʿa tisʿ w rubʿ ynāsbak?","OK. Does the day after tomorrow at quarter past nine suit you?"],["B","إي، يناسبني. اتفقنا!","ī, ynāsibni. ittafagna!","Yes, that suits me. It's a deal!"]],"items":[["متى بتخلص؟","mita bitkhalliṣ?","when will you finish? (to a man)","متى ستنتهي؟","to a woman: mita bitkhallṣīn? (متى بتخلصين؟)"],["أخلص","akhalliṣ","I finish","أنتهي","ana akhalliṣ is-sāʿa khams = I finish at five"],["بدري","badri","early","مبكرًا",""],["نتلاقى","nitlāga","we'll meet; shall we meet?","نلتقي",""],["عندي موعد","ʿindi mawʿid","I've got an appointment","عندي موعد",""],["بعد باكر","baʿd bāchir","the day after tomorrow","بعد غد","you'll see written بعد باجر"],["يناسبك؟","ynāsbak?","does it suit you? (to a man)","هل يناسبك؟","to a woman: ynāsbich? (يناسبج)"],["يناسبني","ynāsibni","it suits me","يناسبني","ma ynāsibni = it doesn't suit me"],["اتفقنا","ittafagna","agreed, it's a deal","اتفقنا",""]]},
{"id":"s1u048","stage":1,"title":"Come on, quick!","goal":"A friend hurries you out of the door: get up, look, listen, take it, come.","tip":"To tell a man to do something, drop the t- of the 'you' verb: tshūf → shūf (look), trūḥ → rūḥ (go), tgūm → gūm (get up). Where two consonants would start the word, add i-: tismaʿ → ismaʿ (listen). 'Come' and 'take' have their own forms: taʿāl, khudh.","grammar":"Imperative to a man: gūm, shūf, rūḥ, taʿāl","dialogue":[["A","سالم، قوم! تأخرنا","Sālim, gūm! taʼakhkharna","Salim, get up! We're late."],["B","دقيقة. روح انت","dagīga. rūḥ inta","One minute. You go."],["A","لا، شوف الساعة! يلا بسرعة","la, shūf is-sāʿa! yalla b-surʿa","No, look at the time! Come on, quick."],["B","زين. اسمع، وين حطيت تلفوني؟","zēn. ismaʿ, wēn ḥaṭṭēt tilifōni?","OK. Listen, where did I put my phone?"],["A","هناك. خذه وتعال!","hnāk. khudhah w taʿāl!","Over there. Take it and come!"]],"items":[["قوم","gūm","get up (to a man)","قم","to a woman: gūmi"],["تأخرنا","taʼakhkharna","we're late","تأخرنا","I'm late: taʼakhkhart (تأخرت)"],["روح","rūḥ","go (to a man)","اذهب","to a woman: rūḥi"],["شوف","shūf","look (to a man)","انظر","to a woman: shūfi"],["تلفون","tilifōn","phone","هاتف","my phone: tilifōni; you'll also hear mobāyl (موبايل)"],["اسمع","ismaʿ","listen (to a man)","اسمع","to a woman: ismaʿi"],["خذ","khudh","take (to a man)","خذ","to a woman: khudhi; khudhah = take it; also said: khidh"],["تعال","taʿāl","come (to a man)","تعال","to a woman: taʿāli; to a group: taʿālu"]]},
{"id":"s1u049","stage":1,"title":"Wait a minute","goal":"Ask Maryam to come and look at a problem at work, and follow her instructions.","tip":"To a woman, add -i to the man's form: shūf → shūfi (look), taʿāl → taʿāli (come). In verbs like ṭarrish, the short i before the last consonant drops: ṭarrish-li → ṭarrshī-li (send me). 'Wait' (UAE) is trayya to a man, trayyi to a woman.","grammar":"Imperative to a woman: add -i (taʿāli, shūfi)","dialogue":[["B","مريم، تعالي شوفي، الله يخليج","Maryam, taʿāli shūfi, allāh ykhallīch","Maryam, come and have a look, please."],["A","تريا شوي. شو فيه؟","trayya shwayy. shu fīh?","Wait a bit. What's up?"],["B","الإيميل ما يفتح","il-īmēl ma yiftaḥ","The email won't open."],["A","طرش لي الإيميل، وأنا بشوف","ṭarrish-li l-īmēl, w ana bashūf","Send me the email and I'll have a look."],["B","طرشته. شوفي الحين","ṭarrashtah. shūfi l-ḥīn","I've sent it. Look now."],["A","هيه، وصل. ييب لي الملف بعد","hē, wiṣal. yīb-li l-malaff baʿad","Yes, it's come. Bring me the file too."]],"items":[["تعالي","taʿāli","come (to a woman)","تعالي","to a man: taʿāl"],["شوفي","shūfi","look (to a woman)","انظري","to a man: shūf"],["تريا","trayya","wait (to a man) (UAE)","انتظر","to a woman: trayyi (تريي); you'll see written اتريا; Kuwait: inṭir (انطر); never istanna (استنى)"],["ييب لي","yīb-li","bring me (to a man)","أحضر لي","to a woman: yībī-li (ييبي لي); you'll see written جيب لي; ييب alone also means 'he brings'"],["طرش لي","ṭarrish-li","send me (to a man)","أرسل لي","to a woman: ṭarrshī-li (طرشي لي)"],["شو فيه؟","shu fīh?","what's up? what's the matter? (also: what's wrong with it?)","ما الأمر؟ / ما به؟","about a person: shfīk? (what's wrong with you?)"],["الملف","il-malaff","the file","الملف",""],["ما يفتح","ma yiftaḥ","it won't open","لا يفتح",""],["بشوف","bashūf","I'll have a look","سأرى",""]]},
{"id":"s1u050","stage":1,"title":"Come here, everyone!","goal":"Call Sēf and his friends together for a photo at Global Village: come, come closer, look, smile, let me, let's.","tip":"To a group, add -u to the man's form: taʿāl → taʿālu, shūf → shūfu, garrib → garrbu (come closer; the i drops). 'Let' to a man is khallni / khallna: khallni ashūf (let me see), khallna nrūḥ (let's go); to a woman khallīni, khallīna; to a group khallūni. The next verb has no 'to'.","grammar":"Imperative to a group: add -u (taʿālu, shūfu); khallni","dialogue":[["B","يا جماعة، تعالوا هني!","yā jamāʿa, taʿālu hni!","Everyone, come over here!"],["A","شو تبي؟","shu tabi?","What do you want?"],["B","خلوني أصوركم. قربوا شوي","khallūni aṣawwirkum. garrbu shwayy","Let me take your photo. Come a bit closer."],["A","يلا شباب، شوفوا هني!","yalla shabāb, shūfu hni!","Come on, guys, look here!"],["B","اضحكوا... خلاص!","iẓḥaku… khalāṣ!","Smile… done!"],["A","خلني أشوف. حلوة! يلا، خلنا نروح","khallni ashūf. ḥilwa! yalla, khallna nrūḥ","Let me see. Lovely! Come on, let's go."]],"items":[["تعالوا","taʿālu","come (to a group)","تعالوا","to one man: taʿāl; to one woman: taʿāli"],["يا جماعة","yā jamāʿa","everyone, folks (calling a group)","يا جماعة",""],["خلني","khallni","let me (to a man)","دعني","to a woman: khallīni (خليني); to a group: khallūni (خلوني); you'll also hear khallīni to men (U); khallni ashūf = let me see"],["أصور","aṣawwir","I take a photo","أصور","aṣawwrak? = shall I take your photo? (to a man); khallūni aṣawwirkum = let me take your photo (to a group)"],["قربوا","garrbu","come closer (to a group)","اقتربوا","to one man: garrib; to one woman: garrbi"],["شوفوا","shūfu","look (to a group)","انظروا","to one man: shūf; to one woman: shūfi"],["اضحكوا","iẓḥaku","smile (for a photo; lit. laugh) (to a group)","ابتسموا","to one man: iẓḥak; to one woman: iẓḥaki"],["خلنا","khallna","let's (to a man)","دعنا","to a woman: khallīna (خلينا); to a group: khallūna (خلونا); you'll also hear khallīna to men (U); khallna nrūḥ = let's go"]],"culture":"In public places, ask before you photograph people and keep women and families you don't know out of your photos. In the UAE, taking or sharing photos of people without their consent is also against the law, with heavy fines. Many families prefer that photos of their women aren't taken or shared. (Needs a native check.)"},
{"id":"s1u051","stage":1,"title":"Don't go yet","goal":"Say goodbye to Sēf at the end of the evening: don't go, don't forget, don't worry, take care.","tip":"For 'don't', put la before the ordinary 'you' verb, not the command form: trūḥ → la trūḥ (don't go), tinsa → la tinsa (don't forget). To a woman the verb keeps -īn: la trūḥīn, la tḥātīn; to a group -ūn: la trūḥūn.","grammar":"Don't: la + the 'you' verb (la trūḥ, la trūḥīn)","dialogue":[["A","يلا، أنا بروح","yalla, ana barūḥ","Right, I'm off."],["B","لا تروح! تو الناس","la trūḥ! taww in-nās","Don't go! It's still early."],["A","لازم، عندي دوام باكر الصبح","lāzim, ʿindi dawām bāchir iṣ-ṣubḥ","I have to, I've got work tomorrow morning."],["B","زين. لا تنسى تلفونك!","zēn. la tinsa tilifōnak!","OK. Don't forget your phone!"],["A","لا تحاتي، هذا هو. في أمان الله","la tḥāti, hādha huwa. fī amān illāh","Don't worry, here it is. Bye."],["B","مع السلامة. انتبه، لا تسوق بسرعة!","maʿa s-salāma. intibih, la tsūg b-surʿa!","Bye. Take care, don't drive fast!"]],"items":[["لا تروح","la trūḥ","don't go (to a man)","لا تذهب","to a woman: la trūḥīn; to a group: la trūḥūn (لا تروحون)"],["لا تروحين","la trūḥīn","don't go (to a woman)","لا تذهبي","to a man: la trūḥ"],["لا تنسى","la tinsa","don't forget (to a man)","لا تنس","to a woman: la tinsīn"],["لا تحاتي","la tḥāti","don't worry (to a man)","لا تقلق","to a woman: la tḥātīn"],["دوام","dawām","work hours, a shift","دوام","ʿindi dawām = I'm working (I have work); also school or university hours"],["هذا هو","hādha huwa","here it is","ها هو","for a feminine thing: hādhi hiya"],["انتبه","intibih","be careful, take care (to a man)","انتبه","to a woman: intibhi"],["لا تسوق بسرعة","la tsūg b-surʿa","don't drive fast (to a man)","لا تسرع","to a woman: la tsūgīn b-surʿa"],["تو الناس","taww in-nās","it's still early (don't leave yet)","ما زال الوقت مبكرًا",""]],"culture":"Evenings in the Gulf start late, especially in summer, when the day is too hot to go out. Friends often meet after the ʿisha prayer and stay out until midnight, so ten o'clock can still be taww in-nās."},
{"id":"s1u052","stage":1,"title":"Checkpoint: errands with Maryam","goal":"Maryam pops out to the bank: ask her to bring something back, answer her reminder and talk about what you did.","tip":"This checkpoint mixes requests with the past. To a woman the command adds -i (yībī-li, khudhi), and 'don't' keeps -īn (la tḥātīn, la tinsīn). The past: ṭarrashtah (I sent it).","grammar":"checkpoint 1.3","dialogue":[["A","سالم، أنا رايحة البنك. برجع على طول","Sālim, ana rāyḥa l-bank. barjaʿ ʿala ṭūl","Salim, I'm going to the bank. I'll be straight back."],["B","زين. ييبي لي قهوة، الله يخليج","zēn. yībī-li gahwa, allāh ykhallīch","OK. Bring me a coffee, please."],["A","إن شاء الله. لا تنسى الإيميل!","in shāʼ allāh. la tinsa l-īmēl!","Sure. Don't forget the email!"],["B","لا تحاتين، طرشته البارحة. خذي، عشرين درهم","la tḥātīn, ṭarrashtah il-bārḥa. khudhi, ʿishrīn dirham","Don't worry, I sent it yesterday. Here, take twenty dirhams."],["A","لا، خلها علي!","la, khallha ʿalay!","No, it's on me!"],["B","زين. بس لا تنسين، بدون سكر!","zēn. bas la tinsīn, bidūn sukkar!","OK. But don't forget, no sugar!"]],"items":[["ييبي لي","yībī-li","bring me (to a woman)","أحضري لي","to a man: yīb-li; you'll see written جيبي لي"],["خذي","khudhi","take (to a woman)","خذي","to a man: khudh"],["لا تحاتين","la tḥātīn","don't worry (to a woman)","لا تقلقي","to a man: la tḥāti"],["لا تنسين","la tinsīn","don't forget (to a woman)","لا تنسي","to a man: la tinsa"],["على طول","ʿala ṭūl","straight away","فورًا / مباشرةً","also 'straight on' when giving directions, and 'always, all the time'"],["خلها علي","khallha ʿalay","it's on me (I'll pay)","على حسابي","said when offering to pay"]]},
{"id":"s1u053","stage":1,"title":"Do you want to come?","goal":"Invite Maryam to lunch, hear her say no, and offer to bring her something back.","tip":"abi (I want) and tabi (you want) take the next verb with no 'to': abi atghadda (I want to have lunch), ma abi aṭlaʿ. To a woman, tabīn; her own verb takes -īn too: tabīn trūḥīn? (do you want to go?), but tabīn ayīb-lich shay? (do you want me to bring you something?)","grammar":"Want + verb: abi atghadda, tabi trūḥ, tabīn trūḥīn","dialogue":[["B","مريم، تبين تروحين ويانا؟","Maryam, tabīn trūḥīn wiyyāna?","Maryam, do you want to come with us?"],["A","وين بتروحون؟","wēn bitrūḥūn?","Where are you going?"],["B","المول. أبي أتغدى هناك","il-mōl. abi atghadda hnāk","The mall. I want to have lunch there."],["A","مشكور، بس ما أبي أطلع. عندي شغل","mashkūr, bas ma abi aṭlaʿ. ʿindi shughul","Thanks, but I'd rather not go out. I've got work."],["B","العفو. تبين أييب لج شي؟","il-ʿafu. tabīn ayīb-lich shay?","No problem. Do you want me to bring you anything?"],["A","هيه، أي شي حلو، الله يخليك!","hē, ay shay ḥilu, allāh ykhallīk!","Yes, anything sweet, please!"]],"items":[["تبين؟","tabīn?","do you want? (to a woman)","هل تريدين؟","to a man: tabi?"],["تبي تروح؟","tabi trūḥ?","do you want to go? (to a man)","هل تريد أن تذهب؟","to a woman: tabīn trūḥīn? (تبين تروحين؟)"],["وين بتروحون؟","wēn bitrūḥūn?","where are you going? (to a group)","إلى أين ستذهبون؟","to one man: wēn bitrūḥ?; to one woman: wēn bitrūḥīn?"],["أبي أتغدى","abi atghadda","I want to have lunch","أريد أن أتغدى",""],["ما أبي","ma abi","I don't want (to)","لا أريد","UAE also: ma abā (ما أبا)"],["أطلع","aṭlaʿ","(I) go out","أخرج","ma abi aṭlaʿ = I don't want to go out"],["أي شي","ay shay","anything","أي شيء",""],["أييب لك","ayīb-lak","I bring you, I'll get you (to a man)","أحضر لك","to a woman: ayīb-lich (أييب لج); tabi ayīb-lak shay? = shall I get you something?"]]},
{"id":"s1u054","stage":1,"title":"Can I help?","goal":"Offer to help Maryam at the office and ask her to teach you how she makes a presentation.","tip":"agdar (I can) and tigdar (you can) work like abi: the next verb follows with no 'to'. agdar asāʿdak? (can I help you? to a man), agdar asāʿdich? (to a woman). To a woman tigdar becomes tigdarīn: tigdarīn tʿallmīnni? (can you teach me?)","grammar":"Can + verb: agdar asāʿdak, tigdar, tigdarīn","dialogue":[["B","مريم، أقدر أساعدج؟","Maryam, agdar asāʿdich?","Maryam, can I help you?"],["A","أكيد. تقدر تييب لي الأوراق؟","akīd. tigdar tyīb-li l-awrāg?","Sure. Can you bring me the papers?"],["B","طبعا، تفضلي. شو هذا؟","ṭabʿan, tfaẓẓali. shu hādha?","Of course, here you are. What's this?"],["A","عرض حق الاجتماع. تبي تتعلم؟","ʿarẓ ḥagg il-ijtimāʿ. tabi titʿallam?","A presentation for the meeting. Do you want to learn (how)?"],["B","إي! تقدرين تعلميني؟","ī! tigdarīn tʿallmīnni?","Yes! Can you teach me?"],["A","طبعا. باكر الصبح، بعد الاجتماع","ṭabʿan. bāchir iṣ-ṣubḥ, baʿd il-ijtimāʿ","Of course. Tomorrow morning, after the meeting."]],"items":[["أقدر أساعدك؟","agdar asāʿdak?","can I help you? (to a man)","هل أستطيع مساعدتك؟","to a woman: agdar asāʿdich? (أقدر أساعدج)"],["تقدر","tigdar","you can, can you? (to a man)","تستطيع","to a woman: tigdarīn (تقدرين)"],["تقدر تعلمني؟","tigdar tʿallimni?","can you teach me? (to a man)","هل تستطيع أن تعلمني؟","to a woman: tigdarīn tʿallmīnni? (تقدرين تعلميني؟)"],["تييب لي","tyīb-li","you bring me (to a man)","تحضر لي","to a woman: tyībīn-li; tigdar tyīb-li…? = can you bring me…?; you'll see written تجيب لي"],["أكيد","akīd","sure, definitely","بالتأكيد",""],["طبعا","ṭabʿan","of course","طبعًا",""],["تبي تتعلم؟","tabi titʿallam?","do you want to learn? (to a man)","هل تريد أن تتعلم؟","to a woman: tabīn titʿallamīn?"],["الأوراق","il-awrāg","the papers, the documents","الأوراق","one sheet: warga (ورقة)"],["عرض","ʿarẓ","a presentation","عرض تقديمي","also 'an offer, a deal' in shops; at work you'll also hear the English: presentation"]]},
{"id":"s1u055","stage":1,"title":"What do you like?","goal":"Tell Sēf what you like and don't like about life in Dubai.","tip":"aḥibb (I like, I love) takes a noun or a verb with no 'to': aḥibb il-baḥar, aḥibb arūḥ il-baḥar (I like going to the beach). ʿājibni means 'I like it' (it pleases me): ish-shughul ʿājibni. Ask a man ʿājbak? and a woman ʿājbich?","grammar":"Like + verb: aḥibb arūḥ, ma aḥibb; ʿājibni","dialogue":[["A","شحالك؟ الشغل عاجبك؟","shḥālak? ish-shughul ʿājbak?","How are you? Do you like the job?"],["B","زين الحمد لله. إي، عاجبني وايد","zēn il-ḥamdu lillāh. ī, ʿājibni wāyid","Fine, thank God. Yes, I like it a lot."],["A","وشو تحب تسوي يوم السبت؟","w shu tḥibb tsawwi yōm is-sabt?","And what do you like doing on Saturdays?"],["B","أحب أروح البحر","aḥibb arūḥ il-baḥar","I like going to the beach."],["A","في الصيف؟ الحر وايد!","fi ṣ-ṣēf? il-ḥarr wāyid!","In summer? It's so hot!"],["B","عادي. أنا ما أحب البرد","ʿādi. ana ma aḥibb il-bard","That's fine. I don't like the cold."]],"items":[["عاجبني","ʿājibni","I like it (it pleases me)","يعجبني","do you like it?: ʿājbak? (to a man), ʿājbich? (to a woman); for a feminine thing: ʿājbatni (عاجبتني)"],["أحب","aḥibb","I like, I love","أحب","aḥibb arūḥ = I like going"],["ما أحب","ma aḥibb","I don't like","لا أحب",""],["تحب؟","tḥibb?","do you like? (to a man)","هل تحب؟","to a woman: tḥibbīn?"],["شو تسوي؟","shu tsawwi?","what do you do? / what are you doing? (to a man)","ماذا تفعل؟","to a woman: shu tsawwīn?"],["عادي","ʿādi","it's fine, no big deal, normal","عادي",""],["الحر","il-ḥarr","the heat","الحر","the adjective is ḥārr (hot)"],["الصيف","iṣ-ṣēf","summer","الصيف",""],["البرد","il-bard","the cold (weather)","البرد",""]]},
{"id":"s1u056","stage":1,"title":"Maybe, because…","goal":"Answer Sēf's invitation to the desert: maybe, why, because, why not.","tip":"Give a reason with ʿashān (because) and a whole sentence: ʿashān ʿindi imtiḥān (because I've got an exam). Invitations use tabi + verb: tabi tiyi? (do you want to come?). Not sure yet? yimkin (maybe), mub akīd (not sure).","grammar":"Want + verb: tabi tyī; because: ʿashān","dialogue":[["A","تبي تيي البر ويانا يوم الجمعة؟","tabi tiyi l-barr wiyyāna yōm il-jumʿa?","Do you want to come to the desert with us on Friday?"],["B","يمكن، مب أكيد","yimkin, mub akīd","Maybe, I'm not sure."],["A","ليش؟ شو عندك؟","lēsh? shu ʿindak?","Why? What have you got on?"],["B","عشان عندي امتحان، ولازم أدرس","ʿashān ʿindi imtiḥān, w lāzim adris","Because I've got an exam, and I have to study."],["A","عادي، نرجع بدري إذا تبي","ʿādi, nirjaʿ badri idha tabi","No problem, we'll come back early if you want."],["B","زين، ليش لا!","zēn, lēsh la!","OK, why not!"]],"items":[["تبي تيي؟","tabi tiyi?","do you want to come? (to a man)","هل تريد أن تأتي؟","to a woman: tabīn tiyīn? (تبين تيين؟); you'll see written تجي"],["يمكن","yimkin","maybe","ربما",""],["مب أكيد","mub akīd","not sure, not certain","غير مؤكد","Kuwait: mū akīd"],["عشان","ʿashān","because","لأن","also everyday: lann (لأن); fast speech: ʿshān"],["امتحان","imtiḥān","exam","امتحان",""],["البر","il-barr","the desert (out of town)","الصحراء","rāyḥīn il-barr = going out to the desert"],["نرجع","nirjaʿ","we (will) come back","نرجع",""],["إذا تبي","idha tabi","if you want (to a man)","إذا أردت","to a woman: idha tabīn"],["ليش لا","lēsh la","why not","لم لا",""]],"culture":"In the cooler months, roughly November to March, many Emirati families and friends drive out to il-barr at the weekend to camp, light a fire and drink gahwa. In summer it is far too hot."},
{"id":"s1u057","stage":1,"title":"Breakfast at the cafeteria","goal":"Say you haven't had breakfast and thank Sēf when he offers to pay","tip":"Past recap: trayyagt? 'have you had breakfast?' and trayyagt 'I've had breakfast' sound the same, like shirabt; ma trayyagt = I haven't. Endings recap: ḥsāb + -i gives ʿala ḥsābi, 'on my account', so 'it's on me'.","grammar":"recycle: possessives, past, modals","dialogue":[["A","صباح الخير يا ريّال. تريقت؟","ṣabāḥ il-khēr yā rayyāl. trayyagt?","Morning, man. Have you had breakfast?"],["B","صباح النور. لا، ما تريقت. أنا يوعان","ṣabāḥ in-nūr. la, ma trayyagt. ana yōʿān","Morning. No, I haven't. I'm hungry."],["A","يلا، الريوق على حسابي. كرك وخبز وبيض؟","yalla, ir-riyūg ʿala ḥsābi. karak w khubz w bēẓ?","Come on, breakfast's on me. Karak, bread and eggs?"],["B","مشكور! الكرك هني حلو، صح؟","mashkūr! il-karak hni ḥilu, ṣaḥḥ?","Thanks! The karak here is good, isn't it?"],["A","صح، وايد حلو. بالعافية!","ṣaḥḥ, wāyid ḥilu. bil-ʿāfya!","True, really good. Enjoy!"],["B","الله يعافيك","allāh yʿāfīk","Thanks (God give you health)."]],"items":[["ريوق","riyūg","breakfast","فطور","you'll also hear fuṭūr (فطور)"],["تريقت","trayyagt","I've had breakfast / have you had breakfast? (to a man)","أفطرتُ / هل أفطرتَ؟","to a woman: trayyagti?; I haven't: ma trayyagt"],["يوعان","yōʿān","hungry (a man)","جائع","a woman: yōʿāna (يوعانة); you'll see written جوعان"],["على حسابي","ʿala ḥsābi","it's on me (I'm paying)","على حسابي",""],["كرك","karak","karak (strong tea boiled with milk and spices)","",""],["خبز","khubz","bread","خبز",""],["بيض","bēẓ","eggs","بيض","one egg: bēẓa"],["صح","ṣaḥḥ","true; right? (tagged on)","صحيح","…, ṣaḥḥ? = …, isn't it?"],["بالعافية","bil-ʿāfya","enjoy (to someone eating or drinking)","هنيئًا","reply: allāh yʿāfīk; to a woman: allāh yʿāfīch"]],"culture":"Karak is strong black tea boiled with milk, sugar and cardamom. Small cafeterias all over Dubai sell it all day, and many people order it without getting out of the car. Among friends, offering to pay (ʿala ḥsābi) is normal; the other person often protests, or thanks them and pays next time."},
{"id":"s1u058","stage":1,"title":"At the supermarket","goal":"Shop with Maryam for the office breakfast: say what you need and ask a woman what she wants","tip":"Endings recap: nāgiṣ 'missing' + -na gives shu nāgiṣna? 'what do we need?'. To a woman the verb ends in -īn: inti shu tabīn? (to a man: shu tabi?). inzēn means 'OK, will do', or 'OK?' tagged on the end of a request.","grammar":"recycle: possessives, past, modals","dialogue":[["A","باكر الريوق علينا. شو نشتري من السوبرماركت؟","bāchir ir-riyūg ʿalēna. shu nishtiri min is-sūbarmārkit?","Tomorrow breakfast is on us. What shall we buy at the supermarket?"],["B","ناقصنا حليب وخبز. وانتي شو تبين؟","nāgiṣna ḥalīb w khubz. w inti shu tabīn?","We need milk and bread. And what do you want?"],["A","أبي فواكه. وخذ كيس، انزين؟","abi fawākih. w khudh kīs, inzēn?","I want fruit. And take a bag, OK?"],["B","أوكي. شي ثاني؟","ōkē. shay thāni?","OK. Anything else?"],["A","لا، بس جي. يلا نروح","la, bas chī. yalla nrūḥ","No, that's it. Let's go."]],"items":[["نشتري","nishtiri","we buy / shall we buy?","نشتري","I buy: ashtiri"],["السوبرماركت","is-sūbarmārkit","the supermarket","السوبرماركت / المتجر","you'll also hear il-jamʿiyya (الجمعية), the local co-op supermarket"],["ناقص","nāgiṣ","missing, lacking; short of","ناقص","shu nāgiṣna? = what do we need?"],["حليب","ḥalīb","milk","حليب",""],["فواكه","fawākih","fruit","فواكه",""],["كيس","kīs","bag (plastic or paper)","كيس",""],["انزين","inzēn","OK, will do; OK? (after a request); well, so… (to start)","حسنًا","said when you agree to do something; to start a sentence: inzēn, shu tabi? = so, what do you want?"],["أوكي","ōkē","OK","","from English; normal among young people"],["شي ثاني؟","shay thāni?","anything else?","شيء آخر؟",""]]},
{"id":"s1u059","stage":1,"title":"Ordering dinner in","goal":"Greet Sēf after his shower, suggest ordering dinner from a restaurant and insist on paying","tip":"After a shower or a haircut say naʿīman; the reply is allāh yinʿim ʿalēk. Endings recap: ʿala ḥsābi 'on me'. Insist with la wallāh: la wallāh, hal-marra ʿalay 'no way, this time it's on me'.","grammar":"recycle: possessives, past, modals","dialogue":[["B","نعيما!","naʿīman!","Naʿīman! (said after a shower)"],["A","الله ينعم عليك. شو نتعشى؟","allāh yinʿim ʿalēk. shu nitʿashsha?","Thanks (God bless you). What shall we have for dinner?"],["B","أنا يوعان. نطلب أكل من مطعم؟","ana yōʿān. niṭlub akil min maṭʿam?","I'm hungry. Shall we order food from a restaurant?"],["A","هيه، عيش ودياي. والعشا على حسابي","hē, ʿēsh w diyāy. w il-ʿasha ʿala ḥsābi","Yes, rice and chicken. And dinner's on me."],["B","لا والله، هالمرة علي!","la wallāh, hal-marra ʿalay!","No way, this time it's on me!"]],"items":[["نعيما","naʿīman","said to someone fresh from a shower or a haircut","نعيمًا","reply: allāh yinʿim ʿalēk"],["الله ينعم عليك","allāh yinʿim ʿalēk","reply to naʿīman (to a man)","أنعم الله عليك","to a woman: allāh yinʿim ʿalēch"],["نتعشى","nitʿashsha","we have dinner / shall we have dinner?","نتعشى","I've had dinner: tʿashshēt (تعشيت)"],["نطلب","niṭlub","we order / shall we order?","نطلب",""],["أكل","akil","food","طعام","the food: il-akil"],["دياي","diyāy","chicken","دجاج","you'll see written دجاج too; one chicken: diyāya"],["عشا","ʿasha","dinner","عشاء",""],["لا والله","la wallāh","no way, no really (refusing or insisting)","","used when you insist, e.g. on paying"]]},
{"id":"s1u060","stage":1,"title":"Lunch at Sēf's house","goal":"Answer Umm Sēf's welcome, praise her cooking and say you're full","tip":"To a woman, use -ich: allāh yḥayyīch, allāh yʿāfīch. tislam īdich 'bless your hand' thanks the cook; the hand is the subject, so tislam doesn't change. Past recap: shbaʿt 'I'm full'. Endings: ṣaḥnak 'your plate'.","grammar":"recycle: possessives, past, modals","dialogue":[["A","حياك الله. تفضل على الغدا","ḥayyāk allāh. tfaẓẓal ʿala l-ghada","Welcome. Please, come and have lunch."],["B","الله يحييج. ما شاء الله، سمك ولحم!","allāh yḥayyīch. mā shāʼ allāh, simach w laḥam!","Thank you. Wow, fish and meat!"],["A","كل، كل! صحنك فاضي","kil, kil! ṣaḥnak fāẓi","Eat, eat! Your plate's empty."],["B","والله شبعت. تسلم إيدج، وايد لذيذ","wallāh shbaʿt. tislam īdich, wāyid ladhīdh","Honestly, I'm full. Bless your hands, it's delicious."],["A","الله يسلمك. بالعافية عليك","allāh ysallmak. bil-ʿāfya ʿalēk","You're welcome. Enjoy it."],["B","الله يعافيج","allāh yʿāfīch","Thank you (God give you health)."]],"items":[["غدا","ghada","lunch","غداء","the lunch: il-ghada"],["سمك","simach","fish","سمك","you'll see written سمج"],["لحم","laḥam","meat","لحم",""],["صحن","ṣaḥan","plate, dish","صحن","your plate: ṣaḥnak"],["فاضي","fāẓi","empty; free (not busy)","فارغ","a woman, or a feminine thing: fāẓya"],["شبعت","shbaʿt","I'm full (I've had enough)","شبعت",""],["تسلم","tislam","thank you (to a man; lit. may you be safe)","شكرًا","to a woman: tislamīn (تسلمين); reply: allāh ysallmak"],["تسلم إيدك","tislam īdak","bless your hands (to a man who cooked or made something)","سلمت يداك","to a woman: tislam īdich (تسلم إيدج); reply: allāh ysallmak"],["لذيذ","ladhīdh","delicious","لذيذ",""]],"culture":"Eat, pass dishes and take your coffee cup with the right hand. A host keeps offering more even after you say you're full; saying wallāh shbaʿt, il-ḥamdu lillāh once or twice is the polite way to stop. Praise the food and thank the cook with tislam īdich (to a man: tislam īdak)."},
{"id":"s1u061","stage":1,"title":"Finding the metro station","goal":"Ask a passer-by the way to the metro and follow directions with 'in front of' and 'behind'","tip":"Place words go straight before the noun: jiddām il-mōl 'in front of the mall', wara l-maḥaṭṭa 'behind the station'. They take the same endings as nouns: jiddāmak 'in front of you', warāh 'behind it'.","grammar":"prepositions of place: jiddām, wara, fōg, taḥt, yamm, barra, ṣōb + noun or ending","dialogue":[["B","لو سمحت، وين محطة المترو؟","law samaḥt, wēn maḥaṭṭat il-mitro?","Excuse me, where's the metro station?"],["A","مب بعيد. روح سيدا صوب الإشارة","mub baʿīd. rūḥ sīda ṣōb il-ishāra","It's not far. Go straight on towards the traffic lights."],["B","عند الإشارة أروح يمين؟","ʿind il-ishāra arūḥ yamīn?","At the lights, do I go right?"],["A","لا، يسار. بتشوف المول قدامك","la, yasār. bitshūf il-mōl jiddāmak","No, left. You'll see the mall in front of you."],["B","والمحطة ورا المول؟","w il-maḥaṭṭa wara l-mōl?","And the station's behind the mall?"],["A","هيه، وراه. خمس دقايق بس","hē, warāh. khams dagāyig bas","Yes, behind it. Just five minutes."]],"items":[["المترو","il-mitro","the metro","المترو",""],["محطة","maḥaṭṭa","station","محطة","the metro station: maḥaṭṭat il-mitro"],["بعيد","baʿīd","far","بعيد","not far: mub baʿīd"],["صوب","ṣōb","towards, in the direction of","نحو","ṣōbak = your way, towards you"],["الإشارة","il-ishāra","the traffic lights","إشارة المرور",""],["عند","ʿind","at, by (a place)","عند","the same word as in ʿindi 'I have'"],["قدام","jiddām","in front of","أمام","jiddāmak = in front of you; you'll see written جدام"],["ورا","wara","behind","وراء / خلف","warāh = behind it"],["بتشوف","bitshūf","you'll see (to a man)","سترى","to a woman: bitshūfīn"]]},
{"id":"s1u062","stage":1,"title":"Up or down? On the metro","goal":"Find the platform and the tickets with Sēf, ask where to get off and sit next to him","tip":"fōg 'up, above' and taḥt 'down, below' stand alone or go before a noun: il-mitro fōg 'the metro's upstairs', taḥt il-mōl 'under the mall'. yamm 'next to' takes endings too: yamm il-bāb 'by the door', yammi 'next to me'.","grammar":"prepositions of place: jiddām, wara, fōg, taḥt, yamm, barra, ṣōb + noun or ending","dialogue":[["A","يلا نركب المترو","yalla nirkab il-mitro","Come on, let's take the metro."],["B","زين. المترو فوق ولّا تحت؟","zēn. il-mitro fōg walla taḥt?","OK. Is the metro upstairs or downstairs?"],["A","فوق. بس التذكرة تحت، يم الباب","fōg. bas it-tadhkara taḥt, yamm il-bāb","Upstairs. But you get the ticket downstairs, by the door."],["B","المترو مب زحمة اليوم. وين ننزل؟","il-mitro mub zaḥma l-yōm. wēn ninzil?","The metro isn't crowded today. Where do we get off?"],["A","في محطة المول. تعال، اقعد يمي","fi maḥaṭṭat il-mōl. taʿāl, igʿid yammi","At the mall station. Come, sit next to me."]],"items":[["نركب","nirkab","we get on / let's take (the bus, the metro)","نركب","I get on: arkab"],["ننزل","ninzil","we get off / let's get off","ننزل",""],["فوق","fōg","up, upstairs; above","فوق",""],["تحت","taḥt","down, downstairs; below","تحت",""],["اقعد","igʿid","sit (down) (to a man)","اجلس","to a woman: igʿidi; UAE also: iylis (ايلس), from yalas 'sat'"],["تذكرة","tadhkara","ticket","تذكرة",""],["يم","yamm","next to, by","بجانب","yammi = next to me; yammak = next to you; you'll also hear jamb (جنب)"],["زحمة","zaḥma","crowded; a crush, traffic","مزدحم / زحام",""]]},
{"id":"s1u063","stage":1,"title":"Where are you? On the phone","goal":"Find Maryam outside the mall by phone: say you're on the way and nearly there, and ask whether she's inside or outside","tip":"barra 'outside' and dākhil 'inside' also go before a noun: barra l-mōl, dākhil il-mōl. yāy 'coming' works like rāyiḥ: a man says yāy, a woman yāya. To a woman the endings take -ich: minnich 'from you', asmaʿich 'I hear you'.","grammar":"prepositions of place: jiddām, wara, fōg, taḥt, yamm, barra, ṣōb + noun or ending","dialogue":[["A","ألو، انت وين؟","alō, inta wēn?","Hello? Where are you?"],["B","أنا في الطريق. ياي الحين","ana fi ṭ-ṭarīg. yāy il-ḥīn","I'm on the way. I'm coming now."],["A","زين. أنا برا المول، عند الباب","zēn. ana barra l-mōl, ʿind il-bāb","OK. I'm outside the mall, by the door."],["B","ما أسمعج عدل. انتي داخل المول؟","ma asmaʿich ʿadil. inti dākhil il-mōl?","I can't hear you properly. Are you inside the mall?"],["A","لا، برا! قدام الباب","la, barra! jiddām il-bāb","No, outside! In front of the door."],["B","انزين، أنا قريب منج. خمس دقايق","inzēn, ana garīb minnich. khams dagāyig","OK, I'm close to you. Five minutes."]],"items":[["انت وين؟","inta wēn?","where are you? (to a man)","أين أنت؟","to a woman: inti wēn?"],["في الطريق","fi ṭ-ṭarīg","on the way","في الطريق",""],["ياي","yāy","coming (a man)","قادم","a woman: yāya (ياية); you'll see written جاي"],["برا","barra","outside","خارج","you'll see written برع"],["داخل","dākhil","inside","داخل",""],["ما أسمعك","ma asmaʿak","I can't hear you (to a man)","لا أسمعك","to a woman: ma asmaʿich (ما أسمعج)"],["عدل","ʿadil","properly, right; straight","جيدًا","ma asmaʿak ʿadil = I can't hear you properly"],["قريب منك","garīb minnak","close to you (to a man)","قريب منك","to a woman: garīb minnich"]]},
{"id":"s1u064","stage":1,"title":"Bus or metro? Getting to the airport","goal":"Ask Sēf how to get to the airport and compare the bus, the metro and walking","tip":"chēf? 'how?' asks the same as shlōn? from u15; both are fine: chēf arūḥ il-maṭār? 'how do I get to the airport?'. Place words keep working: il-mōgif jiddām il-bēt 'the stop's in front of the house'.","grammar":"prepositions of place: jiddām, wara, fōg, taḥt, yamm, barra, ṣōb + noun or ending","dialogue":[["B","باكر بروح المطار. كيف أروح؟","bāchir barūḥ il-maṭār. chēf arūḥ?","Tomorrow I'm going to the airport. How do I get there?"],["A","بالمترو أو بالتاكسي","bil-mitro aw bit-tāksi","By metro or by taxi."],["B","والباص؟ الموقف قدام البيت","w il-bāṣ? il-mōgif jiddām il-bēt","And the bus? The stop's in front of the house."],["A","الباص يوصل المطار، بس مب سريع","il-bāṣ yōṣal il-maṭār, bas mub sarīʿ","The bus gets to the airport, but it isn't fast."],["B","زين، المترو. المحطة بعيدة؟","zēn, il-mitro. il-maḥaṭṭa baʿīda?","OK, the metro. Is the station far?"],["A","لا، يم المول. خمس دقايق على ريولك","la, yamm il-mōl. khams dagāyig ʿala ryūlak","No, it's by the mall. Five minutes on foot."]],"items":[["كيف","chēf","how?","كيف","the same as shlōn (u15); some say kēf"],["المطار","il-maṭār","the airport","المطار",""],["أو","aw","or","أو","in a question you'll also hear walla"],["الباص","il-bāṣ","the bus","الحافلة",""],["موقف","mōgif","(bus) stop; car park","موقف","bus stop: mōgif il-bāṣ"],["يوصل","yōṣal","it gets there, it reaches","يصل",""],["سريع","sarīʿ","fast, quick","سريع","not fast: mub sarīʿ"],["على ريولي","ʿala ryūli","on foot (lit. on my feet)","سيرًا على الأقدام","to a man: ʿala ryūlak; to a woman: ʿala ryūlich (على ريولج); you'll see written رجولي"]]},
{"id":"s1u065","stage":1,"title":"Checkpoint 1.4: a day out with Sēf","goal":"Meet Sēf and his friends: find them, suggest lunch and argue over the bill, speaking to a group","tip":"Talking to a group, use intu and plural endings. Adjectives take -īn: yōʿānīn 'hungry', garībīn 'close'; yāy becomes yāyīn 'coming', and verbs take -ūn: tabūn? 'do you want?'. ḥsāb takes -na for 'us': ʿala ḥsābna 'it's on us'.","grammar":"checkpoint 1.4: recycle s1u053–s1u064","dialogue":[["B","هلا سيف، انتو وين؟","hala Sēf, intu wēn?","Hi Sēf, where are you guys?"],["A","هلا فيك! ياين، نحن في المترو، قريبين","hala fīk! yāyīn, niḥin fi l-mitro, garībīn","Hi! Coming, we're on the metro, close by."],["B","زين. انتو يوعانين؟ تبون نتغدى في المول؟","zēn. intu yōʿānīn? tabūn nitghadda fi l-mōl?","Great. Are you hungry? Do you want to have lunch at the mall?"],["A","هيه والله! المطعم وين؟","hē wallāh! il-maṭʿam wēn?","Definitely! Where's the restaurant?"],["B","فوق، يم السينما. والغدا على حسابي","fōg, yamm is-sīnama. w il-ghada ʿala ḥsābi","Upstairs, next to the cinema. And lunch is on me."],["A","لا والله، الغدا على حسابنا!","la wallāh, il-ghada ʿala ḥsābna!","No way, lunch is on us!"]],"items":[["انتو وين؟","intu wēn?","where are you? (to a group)","أين أنتم؟","to one man: inta wēn?; to one woman: inti wēn?"],["ياين","yāyīn","coming (a group; we or they)","قادمون","one man: yāy; one woman: yāya"],["قريبين","garībīn","close, nearby (a group)","قريبون","one man: garīb; one woman: garība"],["يوعانين","yōʿānīn","hungry (a group)","جائعون","one man: yōʿān; one woman: yōʿāna"],["تبون؟","tabūn?","do you want? (to a group)","هل تريدون؟","to one man: tabi?; to one woman: tabīn?"],["على حسابنا","ʿala ḥsābna","it's on us (we're paying)","على حسابنا",""]]},
{"id":"s1u066","stage":1,"title":"A1 exit: where I live and who I know","goal":"Tell Umm Sēf where you live, who you live with and what the area is like","tip":"sākin 'living' works like rāyiḥ: a man says sākin, a woman sākna. Adjectives agree too: il-manṭiga hādya 'the area's quiet', il-jīrān ṭayybīn 'the neighbours are nice'. Endings: b-rūḥak 'on your own', aʿarfah 'I know him', aʿarfhum 'I know them'.","grammar":"A1 exit: describe where I live and people I know","dialogue":[["A","وين ساكن الحين؟","wēn sākin il-ḥīn?","Where are you living now?"],["B","في مردف، في شقة صغيرة","fi Mirdif, fi shigga ṣghīra","In Mirdif, in a small flat."],["A","ساكن بروحك؟","sākin b-rūḥak?","Do you live on your own?"],["B","لا، ويا ربيعي. أعرفه من الجامعة","la, wiyya rbīʿi. aʿarfah min il-jāmʿa","No, with my friend. I know him from university."],["A","ما شاء الله. والمنطقة حلوة؟","mā shāʼ allāh. w il-manṭiga ḥilwa?","How lovely. And is the area nice?"],["B","هيه، هادية. والجيران طيبين، أعرفهم كلهم","hē, hādya. w il-jīrān ṭayybīn, aʿarfhum killhum","Yes, it's quiet. And the neighbours are nice, I know them all."]],"items":[["ساكن","sākin","living (in a place) (a man)","ساكن","a woman: sākna (ساكنة); wēn sākin? = where do you live?"],["أعرفه","aʿarfah","I know him","أعرفه","I know her: aʿarfha (أعرفها)"],["منطقة","manṭiga","area, neighbourhood","منطقة",""],["هادية","hādya","quiet, calm (with a feminine noun: area, flat)","هادئة","for a masculine noun: hādi (هادي)"],["الجيران","il-jīrān","the neighbours","الجيران","one neighbour: jār"],["أعرفهم","aʿarfhum","I know them","أعرفهم",""]],"culture":"Most people living in Dubai aren't Emirati, so English is often the working language in shops and offices. With Emiratis and other Arabic speakers, start in Arabic anyway: a few Gulf words usually change the tone of the whole conversation."}

function speakPart(text,o){

    if(!text){ res(); return; }
    if(TTS&&(en?!enVoice:useClaudeVoice())){ TTS.speak(String(text).slice(0,2000),{rate:Math.max(0.7,Math.min(1.5,o.rate||1))}).then(()=>res(),e=>{ if(e&&e.code==="not_granted"){ TTS=null; pickVoices(); } res(); }); return; }

// say it, then see word by word what was caught: explicit feedback on the exact words is what moves pronunciation
function speakWidget(target,onScore){
  const fb=el("div",{className:"feedback stack",role:"status",style:"justify-items:center;gap:6px"});
  const box=el("div",{className:"stack",style:"justify-items:center;width:100%"});
  if(!canListen()){ box.append(el("p",{className:"tag",textContent:"Say it out loud, then check against the answer and the audio."})); return box; }
  const mic=el("button",{className:"btn primary",type:"button"},icon("mic"),el("span",{textContent:"Say it"}));
  const label=t=>{ mic.lastChild.textContent=t; };
  const msg=(cls,t)=>{ fb.className="feedback stack "+cls; fb.textContent=t; };
  const result=alts=>{
    let best=null; for(const a of alts){ const m=wordMatch(target,a); if(!best||m.pct>best.pct) best=Object.assign(m,{heard:a}); }
    fb.textContent=""; fb.className="feedback stack "+(best.pct>=75?"ok":"no");
    ap(fb,el("p",{textContent:(best.pct>=75?"Good":best.pct>=50?"Close, try once more":"Try again")+` · ${best.pct}%`}),
      el("div",{className:"words",lang:"ar"},best.words.map(x=>el("span",{className:x.ok?"hit":"miss",textContent:x.w}))),
      best.heard?el("p",{className:"tag"},"Heard: ",arSpan(best.heard)):null,
      best.words.some(x=>!x.ok)?el("p",{className:"tag",textContent:"Red: words it didn't catch. Listen again and say those clearly."}):null);
    buzz(best.pct>=75?10:[30,40,30]); if(onScore) onScore(best.pct);
  };
  let active=false;
  mic.onclick=()=>{
    if(DICT){
      if(active){ DICT.stop().catch(()=>{}); return; }
      let timer=0;
      const sink={final:"",partial:"",done:false,
        update(){ msg("",(sink.final+" "+sink.partial).trim()||"Listening…"); },
        ended(reason){ if(sink.done) return; sink.done=true; active=false; clearTimeout(timer); label("Say it"); if(dictSink===sink) dictSink=null;
          const heard=(sink.final.trim()||sink.partial.trim());
          if(heard){ result([heard]); return; }
          if(reason==="unavailable"&&dictLang==="ar-AE"){ dictLang="ar"; msg("no","Didn't catch that. Tap and try again."); return; }
          if(reason==="not_granted"||reason==="unavailable"){ DICT=null; mic.remove(); msg("no","Speaking practice isn't available here. Say it aloud and compare with the audio."); return; }
          msg("no",reason==="dismissed"?"Allow dictation to practise speaking, or say it aloud and compare.":reason==="rate_limited"?"Too many tries at once. Wait a moment.":"Didn't catch that. Tap and try again."); } };
      stopAudio(); dictSink=sink; active=true; label("Done"); msg("","Listening… tap Done when you've said it");

      timer=setTimeout(()=>{ if(active) DICT.stop().catch(()=>{}); },8000);

    }

      result(r.alts); });

}
