<title>Harf Gulf Arabic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
/* layout: one-column practice app. sticky top bar with stage meter and tabs; "today" is the home surface, the course map sits behind it */
:root{
  --paper:#eef3f1; --card:#fbfdfc; --ink:#13201c; --muted:#56655f; --line:#cddad5;
  --tile:#0f5f5a; --tile-soft:#d6ebe7; --saffron:#b8740f; --good:#2f7d3c; --bad:#b3362c;
  --ar:"Amiri","Noto Naskh Arabic","Times New Roman",serif;
  --ui:"Readex Pro","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1513; --card:#15201d; --ink:#e4ede9; --muted:#9db0a9; --line:#2a3a35;
  --tile:#5fc0b5; --tile-soft:#173a36; --saffron:#e9a53d; --good:#6cc27a; --bad:#ef7d72; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1513; --card:#15201d; --ink:#e4ede9; --muted:#9db0a9; --line:#2a3a35;
  --tile:#5fc0b5; --tile-soft:#173a36; --saffron:#e9a53d; --good:#6cc27a; --bad:#ef7d72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:760px;margin:0 auto;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font:600 19px/1.2 var(--ui);display:flex;align-items:baseline;gap:8px}
.brand h1 .ar{font:700 27px/1 var(--ar);color:var(--tile)}
.stage-pill{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.stage-pill b{color:var(--ink);font-weight:500}
.stage-bar{width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.stage-bar i{display:block;height:100%;background:var(--tile)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:500 14px var(--ui);padding:9px 12px 11px;cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tile)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
main section{padding-top:18px}
h2{font:500 12px var(--ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h3{font:600 18px/1.3 var(--ui);margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:62ch;margin-bottom:14px}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.tr{color:var(--muted);font-style:italic}
.tag{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:500 14px var(--ui);border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--tile)}
.btn.primary{background:var(--tile);border-color:var(--tile);color:var(--paper)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--saffron);padding:8px 12px;background:var(--card);border-radius:0 var(--r) var(--r) 0;max-width:66ch}
.chip{display:inline-block;font-size:12px;border:1px solid var(--saffron);color:var(--saffron);border-radius:99px;padding:2px 9px}
/* today */
.steps{display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;border:1.5px solid var(--line);flex:0 0 auto;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--tile);border-color:var(--tile);color:var(--paper)}
.step.now{border-color:var(--tile)}
.step .body{flex:1;min-width:0}
.step .body b{font-weight:500}
/* cards */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.big{font:400 46px/1.55 var(--ar);direction:rtl;overflow-wrap:anywhere;max-width:100%}
.mid{font:400 30px/1.6 var(--ar);direction:rtl}
.en{font:500 19px var(--ui)}
.msa{font-size:13px;color:var(--muted)}
.msa .ar{font-size:20px;color:var(--ink)}
.meter{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--tile);width:0}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.grades .btn small{display:block;font-size:11px;color:inherit;opacity:.75;font-weight:400}
.feedback{font-weight:500;min-height:1.4em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.options .btn{min-height:54px}
.options .btn.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.options .btn.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.mode{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
/* dialogue */
.dialogue{display:grid;gap:10px}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--tile-soft);color:var(--tile)}
.who.b{background:color-mix(in srgb,var(--saffron) 18%,var(--card));color:var(--saffron)}
.line .txt{min-width:0}
.line .ar{font-size:26px;line-height:1.7;display:block;text-align:right}
.line .en{font-size:14px;font-weight:400}
/* course */
.stagehead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin:18px 0 8px}
.units{display:grid;gap:8px}
.unit{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:left;cursor:pointer;color:var(--ink);font:inherit;width:100%}
.unit[disabled]{cursor:default;opacity:.55}
.unit .t{min-width:0}
.unit .st{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.unit.done .st{color:var(--good)}
/* sounds */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;direction:rtl}
.grid button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);padding:4px}
.grid button .g{font:400 32px/1 var(--ar)}
.grid button .n{font:400 11px var(--ui);color:var(--muted);direction:ltr}
.grid button[aria-pressed="true"]{border-color:var(--tile);background:var(--tile-soft)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:rtl}
.forms div{border:1px solid var(--line);border-radius:var(--r);padding:8px 4px;text-align:center}
.forms .f{font:400 38px/1.4 var(--ar)}
.forms .l{font-size:11px;color:var(--muted);direction:ltr;text-transform:uppercase;letter-spacing:.06em}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs .btn[aria-pressed="true"]{border-color:var(--tile);background:var(--tile-soft)}
.vowel{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.vowel .ar{font-size:38px;text-align:center}
.vowel .min{min-width:0}
table.shift{width:100%;border-collapse:collapse;font-size:14px}
table.shift td,table.shift th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.shift .ar{font-size:24px}
.tablewrap{overflow-x:auto}
/* talk */
.chat{display:grid;gap:10px;margin-bottom:12px}
.msg{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);max-width:92%;min-width:0;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--tile-soft);border-color:transparent}
.msg .ar{font-size:24px;line-height:1.7;display:block}
.msg .fix{font-size:13px;color:var(--saffron);display:block;margin-top:6px}
.compose{display:flex;gap:8px}
.compose textarea{flex:1;min-width:0;resize:vertical;min-height:52px}
select,input[type=text],textarea{font:400 15px var(--ui);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;min-height:44px}
.kv{display:grid;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:7px;font-variant-numeric:tabular-nums}
.setting{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line)}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
@media (max-width:480px){.options{grid-template-columns:1fr}.big{font-size:38px}.grades .btn{padding-inline:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header>
  <div class="brand">
    <h1><span class="ar" lang="ar">حرف</span> Harf</h1>
    <div class="stage-pill"><span id="stage-label">Stage 0</span><span class="stage-bar"><i id="stage-fill"></i></span><span id="streak-label"></span></div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="course">Course</button>
    <button role="tab" data-tab="review">Review</button>
    <button role="tab" data-tab="sounds">Sounds</button>
    <button role="tab" data-tab="talk">Talk</button>
    <button role="tab" data-tab="me">Progress</button>
  </nav>
</header>

<main>
<p class="notice" id="voice-note" hidden style="margin-top:14px"></p>
<section id="today" role="tabpanel"></section>
<section id="course" role="tabpanel" hidden></section>
<section id="review" role="tabpanel" hidden></section>
<section id="sounds" role="tabpanel" hidden></section>
<section id="talk" role="tabpanel" hidden></section>
<section id="me" role="tabpanel" hidden></section>
</main>
<footer id="foot">Gulf Arabic (General Khaleeji, UAE-leaning) for speaking, with Modern Standard Arabic shown for understanding.</footer>
</div>

<script id="logic">
// pure helpers, also run by tests/logic.test.js under node
const HARAKAT=/[ً-ٰٟـ]/g;
function normalizeArabic(s){
  return String(s||"").replace(HARAKAT,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/چ/g,"ك").replace(/گ/g,"ق").replace(/ڤ/g,"ف").replace(/پ/g,"ب")
    .replace(/[^ء-ي\s]/g,"").replace(/\s+/g," ").trim();
}
function levenshtein(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[n];
}
function similarity(a,b){
  const x=normalizeArabic(a),y=normalizeArabic(b);
  if(!x&&!y) return 1; const d=levenshtein(x,y); return 1-d/Math.max(x.length,y.length);
}
function letterForms(g,joins){
  const T="ـ";
  return joins?{isolated:g,initial:g+T,medial:T+g+T,final:T+g}:{isolated:g,initial:g,medial:T+g,final:T+g};
}
const DAY=86400000, MATURE_DAYS=7;
// fsrs-5 (open-spaced-repetition defaults). memory = stability s (days until recall drops to 90%) + difficulty k (1-10)
const FSRS_W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const F_FACTOR=19/81, F_DECAY=-0.5;
const LEARN_STEPS=[1,10], RELEARN_STEPS=[10]; // minutes: pimsleur-style graduated recall before a card leaves the day
const clampD=x=>Math.min(10,Math.max(1,x));
const retrievability=(days,s)=>Math.pow(1+F_FACTOR*days/s,F_DECAY);
const intervalDays=(s,ret)=>s/F_FACTOR*(Math.pow(ret,1/F_DECAY)-1);
const initD=G=>clampD(FSRS_W[4]-Math.exp(FSRS_W[5]*(G-1))+1);
const nextD=(k,G)=>{ const dd=-FSRS_W[6]*(G-3); return clampD(FSRS_W[7]*initD(4)+(1-FSRS_W[7])*(k+dd*(10-k)/9)); };
const sSuccess=(k,s,R,G)=>s*(1+Math.exp(FSRS_W[8])*(11-k)*Math.pow(s,-FSRS_W[9])*(Math.exp(FSRS_W[10]*(1-R))-1)*(G===2?FSRS_W[15]:1)*(G===4?FSRS_W[16]:1));
const sFail=(k,s,R)=>Math.min(FSRS_W[11]*Math.pow(k,-FSRS_W[12])*(Math.pow(s+1,FSRS_W[13])-1)*Math.exp(FSRS_W[14]*(1-R)),s);
const sShort=(s,G)=>s*Math.exp(FSRS_W[17]*(G-3+FSRS_W[18]));
// card {s, k, d due ms, t last review ms, r reps, l lapses, st learning step (-1 = in review), i scheduled interval days}
// grade from the ui: 0 again, 1 hard, 2 good, 3 easy
function schedule(card,grade,now,retention){
  const ret=retention||0.9, G=grade+1;
  const c=Object.assign({s:0,k:0,d:0,t:0,r:0,l:0,st:0,i:0},card||{});
  const graduate=()=>{ c.st=-1; c.i=Math.max(1,Math.round(intervalDays(c.s,ret))); c.d=now+c.i*DAY; };
  const step=(steps)=>{ c.i=0;
    if(G===1){ c.st=0; c.d=now+steps[0]*60000; }
    else if(G===2){ c.d=now+Math.round((steps[c.st]||steps[0])*1.5)*60000; }
    else if(G===4){ graduate(); }
    else { c.st++; if(c.st>=steps.length) graduate(); else c.d=now+steps[c.st]*60000; } };
  if(!c.s){ c.s=FSRS_W[G-1]; c.k=initD(G); c.st=0; step(LEARN_STEPS); }
  else if(c.st>=0){ c.s=sShort(c.s,G); c.k=nextD(c.k,G); step(c.l>0?RELEARN_STEPS:LEARN_STEPS); }
  else {
    const elapsed=Math.max(0,(now-c.t)/DAY); const R=retrievability(elapsed,c.s);
    if(G===1){ c.s=sFail(c.k,c.s,R); c.k=nextD(c.k,1); c.l++; c.st=0; c.i=0; c.d=now+RELEARN_STEPS[0]*60000; }
    else { c.s=elapsed<1?sShort(c.s,G):sSuccess(c.k,c.s,R,G); c.k=nextD(c.k,G); graduate(); }
  }
  c.r++; c.t=now; return c;
}
// desirable difficulty: recognise first, then listen, then mostly produce
function cardMode(card,isMsa,isSentence){
  if(isMsa) return (card&&card.r>=2&&card.r%2===0)?"listen":"recognize";
  if(isSentence) return (card&&card.r>=4&&card.r%2===0)?"produce":"build";
  const r=card?card.r:0;
  if(r<2) return "recognize"; if(r===2) return "listen";
  return ["produce","produce","listen","produce","recognize"][r%5];
}
function pickOptions(correct,pool,n,rand){
  rand=rand||Math.random;
  const others=pool.filter(x=>x!==correct); const out=[correct];
  while(out.length<Math.min(n,pool.length)&&others.length){ out.push(others.splice(Math.floor(rand()*others.length),1)[0]); }
  for(let i=out.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
// phone voices read fuṣḥā sounds; flag items whose gulf pronunciation differs from the script
function soundShift(ar,tr){
  const t=String(tr||"").toLowerCase(), a=String(ar||""); const out=[];
  if(/ق/.test(a)&&/g/.test(t.replace(/gh/g,""))) out.push("ق is said g");
  if(/[كچ]/.test(a)&&/ch/.test(t)) out.push("ك is said ch");
  if(/ج/.test(a)&&!/j/.test(t)&&/y/.test(t)) out.push("ج is said y");
  return out;
}
// shape check for ai-written units before they enter the course
function validateUnit(u){
  const errs=[]; const ar=/[ء-ي]/;
  const str=(s,max)=>typeof s==="string"&&s.trim().length>0&&s.length<=max;
  if(!u||typeof u!=="object") return ["not an object"];
  if(!str(u.title,80)) errs.push("title"); if(!str(u.goal,160)) errs.push("goal"); if(!str(u.tip,300)) errs.push("tip");
  if(!Array.isArray(u.dialogue)||u.dialogue.length<3||u.dialogue.length>10) errs.push("dialogue length");
  else u.dialogue.forEach((l,i)=>{ if(!l||!["A","B"].includes(l.who)||!str(l.ar,200)||!ar.test(l.ar)||!str(l.tr,200)||!str(l.en,200)) errs.push("dialogue line "+i); });
  if(!Array.isArray(u.items)||u.items.length<4||u.items.length>9) errs.push("item count");
  else u.items.forEach((it,i)=>{ if(!it||!str(it.ar,80)||!ar.test(it.ar)||!str(it.tr,80)||!str(it.en,80)||(it.msa!=null&&typeof it.msa!=="string")) errs.push("item "+i); });
  return errs;
}
// mastery gate: a stage is done when its units are done and 80% of its items are remembered for a week+
function stageStatus(unitIds,itemIds,state){
  const done=unitIds.filter(id=>state.unitsDone&&state.unitsDone[id]).length;
  const live=itemIds.filter(id=>!(state.suspended&&state.suspended[id]));
  const mature=live.filter(id=>state.cards[id]&&state.cards[id].i>=MATURE_DAYS).length;
  const frac=live.length?mature/live.length:0;
  return {unitsDone:done,units:unitIds.length,mature,items:live.length,frac,complete:unitIds.length>0&&done===unitIds.length&&frac>=0.8};
}
// one day's plan: oldest due cards first (capped), then a new lesson only if the backlog is under control
function planDay(cards,suspended,now,opts){
  const o=Object.assign({maxReviews:60,backlogLimit:40},opts||{});
  const due=Object.keys(cards).filter(id=>!(suspended&&suspended[id])&&cards[id].d<=now).sort((a,b)=>cards[a].d-cards[b].d);
  return {reviews:due.slice(0,o.maxReviews),backlog:due.length,allowNew:due.length<=o.backlogLimit};
}
// interleave: never two cards from the same unit back to back when avoidable
function interleave(ids,unitOf){
  const groups={}; ids.forEach(id=>{const u=unitOf(id);(groups[u]=groups[u]||[]).push(id);});
  const out=[]; let last=null;
  while(out.length<ids.length){
    const keys=Object.keys(groups).filter(k=>groups[k].length).sort((a,b)=>groups[b].length-groups[a].length);
    const k=keys.find(x=>x!==last)||keys[0]; out.push(groups[k].shift()); last=k;
  }
  return out;
}
// compact storage: [s, k, reps, due min, lapses, last min, step, interval]. 5-item arrays are the older sm-2 format
const packCard=c=>[Math.round(c.s*1000)/1000,Math.round(c.k*100)/100,c.r,Math.round(c.d/60000),c.l,Math.round(c.t/60000),c.st,c.i];
function unpackCard(a){
  if(a.length===5){ const i=a[1], d=a[3]*60000; return {s:Math.max(0.4,i),k:5,r:a[2],d,l:a[4],t:d-i*DAY,st:a[2]>0&&i>=1?-1:0,i}; }
  return {s:a[0],k:a[1],r:a[2],d:a[3]*60000,l:a[4],t:a[5]*60000,st:a[6],i:a[7]};
}
const isLeech=c=>!!c&&c.l>=4;
if(typeof module!=="undefined") module.exports={normalizeArabic,levenshtein,similarity,letterForms,schedule,retrievability,intervalDays,isLeech,FSRS_W,cardMode,pickOptions,soundShift,validateUnit,stageStatus,planDay,interleave,packCard,unpackCard,MATURE_DAYS};

async function setupSync(){
  if(!window.claude||!window.claude.use) return;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  DB=db; UID=id;
  try{
    const snap=await DB.doc(`data/users/${UID}/progress`).get();
    if(snap.exists){ const remote=snap.data(); if((remote.updatedAt||0)>(S.updatedAt||0)){ const gen=S.gen; S=hydrate(remote); S.gen=gen; try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){} } else pushRemote(); }
    else pushRemote();
    const us=await DB.doc(`data/users/${UID}/progress`).collection("units").limit(1000).get();
    const known=new Set(S.gen.map(u=>u.id)); let added=false;
    us.docs.forEach(d=>{ const u=d.data(); if(u&&!known.has(u.id)&&!validateUnit(u).length){ S.gen.push(u); added=true; } });
    S.gen.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(added) try{ localStorage.setItem(KEY+"-gen",JSON.stringify(S.gen)); }catch(e){}
    for(const u of S.gen) if(!us.docs.some(d=>d.id===u.id)) saveGenUnit(u);

// listen once, score against target; calls back with {pct, heard} or {error}
function listen(target,cb){

    alts.forEach(a=>{const s=similarity(a,target); if(s>best){best=s;heard=a;}}); cb({pct:Math.round(best*100),heard}); };
  rec.onerror=e=>{ got=true; if(e.error==="not-allowed"||e.error==="service-not-allowed"){ micBlocked=true; cb({error:"blocked"}); } else cb({error:e.error}); };

function sayQueue(parts,onDone){

    if(p.pause){ timer=setTimeout(next,p.pause); return; }

async function generateUnit(host,stage,topic,then){
  host.textContent=""; host.append(el("h2",{textContent:"Writing your next lesson"}));

    await new Promise(res=>{go.onclick=()=>{ if(inp.value.trim()){ chosen=inp.value.trim().slice(0,80); res(); } };});
    host.textContent=""; host.append(el("h2",{textContent:"Writing your next lesson"})); }
  const status=el("p",{className:"tag",textContent:`Topic: ${chosen}. This takes a few seconds.`}); host.append(status);

"items": 6-8 NEW useful phrases from the dialogue [{"ar","tr","en","msa": the Modern Standard Arabic equivalent or "" if the same}]}.
